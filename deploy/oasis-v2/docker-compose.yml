services:
  oasis-memory-db:
    image: pgvector/pgvector:pg16
    container_name: oasis-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oasis_shared_memory
      POSTGRES_USER: oasis_memory
      POSTGRES_PASSWORD: ${OASIS_MEMORY_DB_PASSWORD:?Définir OASIS_MEMORY_DB_PASSWORD dans .env}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oasis_memory -d oasis_shared_memory"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - oasis_internal

  oasis-shared-memory:
    build:
      context: ./shared-memory
    image: oasis-shared-memory:local
    container_name: oasis-shared-memory
    restart: unless-stopped
    environment:
      PORT: "3010"
      DATABASE_URL: postgresql://oasis_memory:${OASIS_MEMORY_DB_PASSWORD:?Définir OASIS_MEMORY_DB_PASSWORD dans .env}@oasis-memory-db:5432/oasis_shared_memory
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Définir OPENROUTER_API_KEY dans .env}
      OASIS_EMBEDDING_MODEL: ${OASIS_EMBEDDING_MODEL:-voyageai/voyage-4}
      OASIS_EMBEDDING_DIMENSIONS: ${OASIS_EMBEDDING_DIMENSIONS:-1024}
      OASIS_MEMORY_EXPORT_TOKEN: ${OASIS_MEMORY_EXPORT_TOKEN:?Définir OASIS_MEMORY_EXPORT_TOKEN dans .env}
    depends_on:
      oasis-memory-db:
        condition: service_healthy
    expose:
      - "3010"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3010/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - oasis_internal

  oasis-gis:
    build:
      context: ./gis-mcp
    image: oasis-gis-mcp:local
    container_name: oasis-gis
    restart: unless-stopped
    environment:
      PORT: "3011"
      OASIS_GIS_WORKSPACE: /workspace
    volumes:
      - ./instance/shared-workspace:/workspace:rw
    expose:
      - "3011"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3011/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - oasis_internal

  oasis-document-studio:
    build:
      context: ./document-studio
    image: oasis-document-studio:local
    container_name: oasis-document-studio
    restart: unless-stopped
    environment:
      PORT: "3012"
      OASIS_DOCUMENT_WORKSPACE: /workspace
    volumes:
      - ./instance/shared-workspace:/workspace:rw
    expose:
      - "3012"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3012/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - oasis_internal

  oasis-optimizer:
    build:
      context: ./optimizer
    image: oasis-supervised-optimizer:local
    container_name: oasis-optimizer
    restart: unless-stopped
    environment:
      PORT: "3013"
      OASIS_WORKSPACE: /workspace
      # Le service et l’outil DSPy sont actifs au démarrage; aucun appel LLM n’est déclenché automatiquement.
      # Mettre false masque seulement optimizer_propose, sans arrêter les contrôles de statut et de validation.
      OASIS_OPTIMIZER_ENABLED: ${OASIS_OPTIMIZER_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Définir OPENROUTER_API_KEY dans .env}
      OASIS_OPTIMIZER_MODEL: ${OASIS_OPTIMIZER_MODEL:-openrouter/qwen/qwen3.7-flash}
      OASIS_OPTIMIZER_MAX_CASES: ${OASIS_OPTIMIZER_MAX_CASES:-2}
      OASIS_OPTIMIZER_MAX_CANDIDATES: ${OASIS_OPTIMIZER_MAX_CANDIDATES:-1}
      OASIS_OPTIMIZER_MAX_CALLS: ${OASIS_OPTIMIZER_MAX_CALLS:-8}
      OASIS_AUTONOMOUS_PIPELINE_TOKEN: ${OASIS_AUTONOMOUS_PIPELINE_TOKEN:?Définir OASIS_AUTONOMOUS_PIPELINE_TOKEN dans .env}
    volumes:
      - ./instance/shared-workspace:/workspace:rw
    expose:
      - "3013"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3013/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - oasis_internal

  oasis-skillopt:
    build:
      context: ./skillopt
    image: oasis-skillopt:local
    container_name: oasis-skillopt
    restart: unless-stopped
    environment:
      PORT: "3014"
      OASIS_WORKSPACE: /workspace
      OASIS_SKILLOPT_SKILL_CATALOG: /skill-catalog
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Définir OPENROUTER_API_KEY dans .env}
      # SkillOpt apprend des compétences approbées dans des cas dépersonnalisés. Les changements restent pending_approval.
      OASIS_SKILLOPT_ENABLED: ${OASIS_SKILLOPT_ENABLED:-true}
      OASIS_SKILLOPT_AUTONOMOUS_ENABLED: ${OASIS_SKILLOPT_AUTONOMOUS_ENABLED:-true}
      OASIS_SKILLOPT_INTERVAL_HOURS: ${OASIS_SKILLOPT_INTERVAL_HOURS:-24}
      OASIS_SKILLOPT_MAX_TRAIN_CASES: ${OASIS_SKILLOPT_MAX_TRAIN_CASES:-2}
      OASIS_SKILLOPT_MAX_VALIDATION_CASES: ${OASIS_SKILLOPT_MAX_VALIDATION_CASES:-2}
      OASIS_SKILLOPT_MAX_HOLDOUT_CASES: ${OASIS_SKILLOPT_MAX_HOLDOUT_CASES:-2}
      OASIS_SKILLOPT_MAX_EPOCHS: ${OASIS_SKILLOPT_MAX_EPOCHS:-1}
      OASIS_SKILLOPT_MAX_STEPS: ${OASIS_SKILLOPT_MAX_STEPS:-1}
      OASIS_SKILLOPT_MAX_COMPLETION_TOKENS: ${OASIS_SKILLOPT_MAX_COMPLETION_TOKENS:-650}
      OASIS_SKILLOPT_MAX_RUNS_PER_DAY: ${OASIS_SKILLOPT_MAX_RUNS_PER_DAY:-1}
      OASIS_SKILLOPT_TIMEOUT_SECONDS: ${OASIS_SKILLOPT_TIMEOUT_SECONDS:-600}
      OASIS_SKILLOPT_OPTIMIZER_MODEL: ${OASIS_SKILLOPT_OPTIMIZER_MODEL:-qwen/qwen3.7-flash}
      OASIS_SKILLOPT_TARGET_MODEL: ${OASIS_SKILLOPT_TARGET_MODEL:-qwen/qwen3.7-flash}
      OASIS_AUTONOMOUS_PIPELINE_TOKEN: ${OASIS_AUTONOMOUS_PIPELINE_TOKEN:?Définir OASIS_AUTONOMOUS_PIPELINE_TOKEN dans .env}
    volumes:
      - ./instance/shared-workspace:/workspace:rw
      - ./profile-skills:/skill-catalog:ro
    expose:
      - "3014"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3014/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - oasis_internal

  oasis-reference-miner:
    build:
      context: ./reference-miner
    image: oasis-reference-miner:local
    container_name: oasis-reference-miner
    restart: unless-stopped
    environment:
      PORT: "3015"
      OASIS_WORKSPACE: /workspace
      OASIS_MEMORY_EXPORT_URL: http://oasis-shared-memory:3010/internal/reference-records
      OASIS_MEMORY_EXPORT_TOKEN: ${OASIS_MEMORY_EXPORT_TOKEN:?Définir OASIS_MEMORY_EXPORT_TOKEN dans .env}
      # La découverte peut être autonome, mais tout candidat reste séparé des packs actifs.
      OASIS_REFERENCE_MINER_ENABLED: ${OASIS_REFERENCE_MINER_ENABLED:-true}
      OASIS_REFERENCE_MINER_AUTONOMOUS_ENABLED: ${OASIS_REFERENCE_MINER_AUTONOMOUS_ENABLED:-true}
      OASIS_REFERENCE_MINER_CYCLE_HOURS: ${OASIS_REFERENCE_MINER_CYCLE_HOURS:-24}
      OASIS_REFERENCE_MINER_MAX_CANDIDATES: ${OASIS_REFERENCE_MINER_MAX_CANDIDATES:-3}
      OASIS_REFERENCE_MINER_MAX_RUNS_PER_DAY: ${OASIS_REFERENCE_MINER_MAX_RUNS_PER_DAY:-1}
      OASIS_AUTONOMOUS_PIPELINE_ENABLED: ${OASIS_AUTONOMOUS_PIPELINE_ENABLED:-true}
      OASIS_AUTONOMOUS_PIPELINE_TOKEN: ${OASIS_AUTONOMOUS_PIPELINE_TOKEN:?Définir OASIS_AUTONOMOUS_PIPELINE_TOKEN dans .env}
      OASIS_OPTIMIZER_AUTONOMOUS_URL: http://oasis-optimizer:3013/internal/autonomous-run
      OASIS_SKILLOPT_AUTONOMOUS_URL: http://oasis-skillopt:3014/internal/autonomous-run
    volumes:
      - ./instance/shared-workspace:/workspace:rw
    depends_on:
      oasis-shared-memory:
        condition: service_healthy
      oasis-optimizer:
        condition: service_healthy
      oasis-skillopt:
        condition: service_healthy
    expose:
      - "3015"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3015/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - oasis_internal

  spacebot-oasis-v2:
    image: spacebot-oasis-v2:local
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: spacebot-oasis-v2
    restart: unless-stopped
    environment:
      SPACEBOT_DIR: /data
      SPACEBOT_DEPLOYMENT: docker
      SPACEBOT_CRON_TIMEZONE: America/Toronto
      SPACEBOT_USER_TIMEZONE: America/Toronto
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Définir OPENROUTER_API_KEY dans .env}
      OASIS_SKILL_INSTALL_REQUIRE_APPROVAL: "true"
      OASIS_SKILL_APPROVAL_DIR: /data/skill-install-authorizations
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
    ports:
      # Interface Web locale. Garder ce bind en localhost sauf si un proxy authentifié est ajouté.
      - "127.0.0.1:19898:19898"
    volumes:
      # Contient config.toml, l'espace partagé, les profils, les bases propres à Spacebot et les journaux.
      - ./instance:/data
    depends_on:
      oasis-shared-memory:
        condition: service_healthy
      oasis-gis:
        condition: service_healthy
      oasis-document-studio:
        condition: service_healthy
      oasis-optimizer:
        condition: service_healthy
      oasis-skillopt:
        condition: service_healthy
      oasis-reference-miner:
        condition: service_healthy
    security_opt:
      # Bubblewrap doit appeler mount(2) dans un namespace privé. Les profils Docker
      # seccomp et AppArmor par défaut l’interdisent même avec CAP_SYS_ADMIN.
      # Le conteneur reste sans socket Docker, sans volume hôte additionnel et avec cap_drop ALL.
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      # Bubblewrap crée un espace de montage isolé pour chaque commande d’agent.
      # SYS_ADMIN est nécessaire à cette opération; toutes les autres capacités restent supprimées.
      - SYS_ADMIN
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19898/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - oasis_internal
      - oasis_approval_internal

  oasis-failure-remediator:
    build:
      context: ./failure-remediator
    image: oasis-failure-remediator:local
    container_name: oasis-failure-remediator
    restart: unless-stopped
    environment:
      PORT: "3017"
      OASIS_WORKSPACE: /data/shared-workspace
      OASIS_SPACEBOT_API_URL: http://spacebot-oasis-v2:19898/api
      OASIS_FAILURE_REMEDIATOR_ENABLED: ${OASIS_FAILURE_REMEDIATOR_ENABLED:-true}
      OASIS_FAILURE_REMEDIATOR_INTERVAL_SECONDS: ${OASIS_FAILURE_REMEDIATOR_INTERVAL_SECONDS:-120}
      OASIS_FAILURE_REMEDIATOR_MAX_PROPOSALS_PER_DAY: ${OASIS_FAILURE_REMEDIATOR_MAX_PROPOSALS_PER_DAY:-3}
      OASIS_FAILURE_REMEDIATOR_TOKEN: ${OASIS_FAILURE_REMEDIATOR_TOKEN:?Définir OASIS_FAILURE_REMEDIATOR_TOKEN dans .env}
    volumes:
      - ./instance:/data:rw
    depends_on:
      spacebot-oasis-v2:
        condition: service_healthy
    expose:
      - "3017"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3017/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - oasis_approval_internal

  oasis-approval-bridge:
    build:
      context: ./approval-bridge
    image: oasis-approval-bridge:local
    container_name: oasis-approval-bridge
    restart: unless-stopped
    environment:
      PORT: "3016"
      OASIS_WORKSPACE: /data/shared-workspace
      OASIS_INSTANCE_ROOT: /data
      OASIS_SPACEBOT_API_URL: http://spacebot-oasis-v2:19898/api
      OASIS_APPROVAL_BRIDGE_ENABLED: ${OASIS_APPROVAL_BRIDGE_ENABLED:-true}
      OASIS_APPROVAL_BRIDGE_INTERVAL_SECONDS: ${OASIS_APPROVAL_BRIDGE_INTERVAL_SECONDS:-60}
      OASIS_APPROVAL_BRIDGE_TOKEN: ${OASIS_APPROVAL_BRIDGE_TOKEN:?Définir OASIS_APPROVAL_BRIDGE_TOKEN dans .env}
    volumes:
      - ./instance:/data:rw
    depends_on:
      spacebot-oasis-v2:
        condition: service_healthy
    expose:
      - "3016"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3016/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - oasis_approval_internal

networks:
  oasis_internal:
    driver: bridge
  oasis_approval_internal:
    driver: bridge
    internal: true
