# Cellule municipale Spacebot — instance locale, OpenRouter uniquement.
# Monter ce fichier sur /data/config.toml (voir docker-compose.yml).
# Prérequis : OPENROUTER_API_KEY dans .env. Aucun Claude. Aucun MCP.

[llm]
openrouter_key = "env:OPENROUTER_API_KEY"

[defaults]
max_concurrent_branches = 1
max_concurrent_workers = 1
max_turns = 8
branch_max_turns = 10
context_window = 96000
history_backfill_count = 12
worker_log_mode = "errors_only"
cron_timezone = "America/Toronto"
user_timezone = "America/Toronto"

# Canal / compacteur : DeepSeek Flash. Branche : GLM Flash.
# Worker défaut : Flash. oss-120b seulement sur mun-outils.
[defaults.routing]
channel = "openrouter/deepseek/deepseek-v4-flash"
branch = "openrouter/z-ai/glm-5.3-flash"
worker = "openrouter/deepseek/deepseek-v4-flash"
compactor = "openrouter/deepseek/deepseek-v4-flash"
cortex = "openrouter/openai/gpt-oss-20b"
rate_limit_cooldown_secs = 90

[defaults.routing.task_overrides]
document_vision = "openrouter/google/gemini-2.5-flash-lite"
deep_reasoning = "openrouter/z-ai/glm-5.3-flash"
structured_extraction = "openrouter/deepseek/deepseek-v4-flash"
data_processing = "openrouter/openai/gpt-oss-120b"
coding = "openrouter/openai/gpt-oss-120b"

[defaults.routing.fallbacks]
"openrouter/deepseek/deepseek-v4-flash" = [
  "openrouter/z-ai/glm-5.3-flash",
  "openrouter/openai/gpt-oss-120b",
]
"openrouter/z-ai/glm-5.3-flash" = [
  "openrouter/deepseek/deepseek-v4-flash",
  "openrouter/openai/gpt-oss-120b",
]
"openrouter/openai/gpt-oss-120b" = [
  "openrouter/deepseek/deepseek-v4-flash",
  "openrouter/z-ai/glm-5.3-flash",
]
"openrouter/openai/gpt-oss-20b" = [
  "openrouter/deepseek/deepseek-v4-flash",
]
"openrouter/google/gemini-2.5-flash-lite" = [
  "openrouter/deepseek/deepseek-v4-flash",
]

[defaults.opencode]
enabled = false
max_servers = 1
server_startup_timeout_secs = 45
max_restart_retries = 2

[defaults.opencode.permissions]
edit = "allow"
bash = "allow"
webfetch = "deny"

[defaults.compaction]
mode = "chronicle"
background_threshold = 0.78
aggressive_threshold = 0.86
emergency_threshold = 0.94

[defaults.compaction.chronicle]
interval_messages = 24
interval_token_fraction = 0.08
recent_window_hours = 24
max_recent = 4
max_older = 6
context_token_budget = 1800
expand_message_limit = 25
max_messages_per_checkpoint = 120
rollup_threshold = 8
rollup_batch = 4

[defaults.memory_persistence]
enabled = false
message_interval = 100

[defaults.skills.reflection]
enabled = false
min_tool_iterations = 20
cooldown_secs = 14400

[defaults.cortex]
tick_interval_secs = 900
worker_wall_clock_timeout_secs = 600
circuit_breaker_threshold = 3

[defaults.autonomy]
level = "off"
interval_secs = 14400
max_turns = 4
max_tasks_per_run = 1
timeout_secs = 600
warn_secs = 480
run_history_count = 3
claim_unowned = false

[defaults.browser]
enabled = false
headless = true
evaluate_enabled = false
persist_session = false
close_policy = "close_tabs"

[defaults.warmup]
enabled = true
eager_embedding_load = false
refresh_secs = 1800
startup_delay_secs = 5

